name: managely
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  provider: ^6.1.5+1
  http: ^1.6.0
  mobile_scanner: ^7.2.0
  geolocator: ^14.0.2
  lottie: ^3.3.3
  pdf: ^3.12.0
  printing: ^5.14.3
  file_saver: ^0.3.1
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5
  syncfusion_flutter_pdfviewer: ^33.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/icon.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/icon.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/Loading Dots Blue.json
    - assets/app_icon/icon.jpeg